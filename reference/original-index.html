/* Layout: phone app shell — scrolling screen + fixed bottom tab bar; deep green header band on Today */
:root{--bg:#eef3f0;--card:#ffffff;--fg:#1b2924;--muted:#5f7068;--line:#d9e3de;--accent:#0f6b52;--accent2:#c9a24a;--soft:#dfeee7;--empty:#e3e9e6;--onacc:#ffffff;--deep:#0b4a3a;--gold:#d8b25a;--goldsoft:rgba(216,178,90,.5);

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.screen{max-width:560px;margin:0 auto;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lbl{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800}
h1{font-family:var(--display);color:var(--accent);font-size:1.9rem;margin:0;line-height:1.2}
.hello{color:var(--muted);margin:0}
.hero{background:var(--accent);color:var(--onacc);border:0}
.hero .lbl{color:var(--onacc);opacity:.8}
.hero .big{font-size:1.3rem;font-weight:800;line-height:1.35}
.hero .meta{opacity:.85;font-size:.88rem}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--onacc);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.fill{background:var(--accent);color:var(--onacc)}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:.75rem;color:var(--muted)}
.ringrow{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--empty)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}

.status{font-weight:700}.status.ok{color:var(--accent)}.status.late{color:var(--accent2)}

.heat i{aspect-ratio:1;border-radius:3px;background:var(--empty);max-width:100%}
.heat i.d{background:var(--accent)}.heat i.t{outline:2px solid var(--accent2);outline-offset:1px}

.juz .b{width:100%;height:34px;background:var(--empty);border-radius:6px;position:relative;overflow:hidden}

.src{font-size:.72rem;color:var(--muted)}

.hero{position:relative;overflow:hidden}

 if(!Q)h+=`<p class="hello" id="loadmsg">Loading ayahs…</p>`;
 else t.p.forEach(p=>{h+=`<div class="ayh"><span class="sh">${N[p[0]-1]}</span><a class="lis" href="https://quran.com/${p[0]}/${p[1]}-${p[2]}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Listen to all</a></div>`;for(let a=p[1];a<=p[2];a++){const v=Q[p[0]-1][a-1];
  h+=`<div class="ay"><div class="ayh"><span class="num">${p[0]}:${a}</span><a class="lis" href="https://quran.com/${p[0]}/${a}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Listen</a></div><div class="ar" lang="ar">${esc(v[0])}</div><div class="tr">${esc(v[1])}</div><div class="bnt" lang="bn">${esc(v[2])}</div></div>`}});
 h+=`</section><button class="btn fill" id="mark">${done[t.d]?'Done ✓ (tap to undo)':'Mark Day '+t.d+' as done'}</button>
 <div class="nav">${t.d>1?`<button class="btn ghost" data-open="${t.d-1}">← Day ${t.d-1}</button>`:''}${t.d<365?`<button class="btn ghost" data-open="${t.d+1}">Day ${t.d+1} →</button>`:''}</div>
 <p class="src">Text, transliteration and Bangla translation: quran-json by Risan Bagja Pradana (CC BY-SA 4.0), from QuranEnc and Tanzil. Daily summaries are based on the Saheeh International English translation.</p>`;
 return h;
}
function vPlan(){
 let h=`<header><h1>Plan</h1><p class="hello">365 days · 19 Oct 2026 – 18 Oct 2027</p></header><section class="card" style="padding-block:4px">`,m='';
 D.forEach((d,i)=>{const mm=new Date(d.date+'T00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  if(mm!==m){h+=`<h2>${mm}</h2>`;m=mm}
  h+=`<div class="row${done[d.d]?' done':''}${i===todayIdx?' now':''}" ${i===todayIdx?'id="nowrow"':''}><input type="checkbox" id="c${d.d}" data-d="${d.d}" ${done[d.d]?'checked':''} aria-label="Day ${d.d} done"><span class="dt">Day ${d.d}<br>${fmt(d.date)}</span><button class="rd" data-open="${d.d}">${d.p.map(txt).join('<br>')}</button></div>`});
 return h+'</section>';
}
function vStats(){
 const n=nDone();let read=new Set();D.forEach(d=>{if(done[d.d])d.p.forEach(p=>{for(let a=p[1];a<=p[2];a++)read.add(gi(p[0],a))})});
 const juz=JUZ.map((j,k)=>{const s=gi(...j),e=k<29?gi(...JUZ[k+1])-1:6236;let c=0;for(let x=s;x<=e;x++)if(read.has(x))c++;return c/(e-s+1)});
 const sur=SC.filter((c,k)=>{for(let a=1;a<=c;a++)if(!read.has(gi(k+1,a)))return false;return true}).length;
 return `<header><h1>Progress</h1><p class="hello">${read.size.toLocaleString()} of 6,236 ayahs read</p></header>
 <div class="tiles"><div class="tile"><b>${juz.filter(x=>x>=1).length}</b><span>of 30 juz</span></div><div class="tile"><b>${sur}</b><span>of 114 surahs</span></div><div class="tile"><b>${streak()}</b><span>day streak</span></div></div>
 <section class="card"><span class="lbl">Juz progress</span><div class="juz">${juz.map((x,k)=>`<div><span class="b"><i style="height:${Math.round(x*100)}%"></i></span>${k+1}</div>`).join('')}</div></section>
 <section class="card"><span class="lbl">Your 365 days</span><div class="heat">${D.map((d,i)=>`<i class="${done[d.d]?'d':''}${i===todayIdx?' t':''}" title="Day ${d.d}"></i>`).join('')}</div>
 <div class="legend"><span><i style="background:var(--accent)"></i>Done</span><span><i style="background:var(--empty)"></i>Not yet</span><span><i style="outline:2px solid var(--accent2);background:var(--empty)"></i>Today</span></div></section>`;
}
const V={today:vToday,read:vRead,plan:vPlan,stats:vStats};
function render(scroll){
 ['today','read','plan','stats'].forEach(k=>{$('v-'+k).hidden=k!==view});
 $('v-'+view).innerHTML=V[view]();
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));
 if(scroll==='top')window.scrollTo(0,0);
 if(scroll==='now'){const r=$('nowrow');if(r)r.scrollIntoView({block:'center'})}
}
function go(v,scroll){view=v;try{localStorage.setItem('qview',v)}catch(e){}render(scroll)}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;if(b.dataset.v==='read'&&view!=='read')sel=sel||D[todayIdx];go(b.dataset.v,b.dataset.v==='plan'?'now':'top')});
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){sel=D[o.dataset.open-1];go('read','top');return}
 const pb=e.target.closest('[data-prac]');if(pb){toggle('prac',pb.dataset.prac);return}
 if(e.target.id==='mark'){toggle('done',String(sel.d))}});
document.addEventListener('change',e=>{const d=e.target.dataset&&e.target.dataset.d;if(!d)return;toggle('done',d)});
render('top');
fetch('../data/quran-data.json').then(r=>r.json()).then(j=>{Q=j;if(view==='read'||view==='today')render()}).catch(()=>{const m=$('loadmsg');if(m)m.textContent='Could not load ayahs. Reload the page.'});
</script>

</body></html>
